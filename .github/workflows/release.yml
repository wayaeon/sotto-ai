name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Rust (MSVC)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Setup Python + uv
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install uv

      - name: Install Python deps + build sidecar
        run: |
          uv pip install --system -r sidecar/requirements.txt
          pip install pyinstaller
          pyinstaller --clean --noconfirm sidecar.spec --distpath src-tauri/binaries
          mv src-tauri/binaries/sidecar.exe src-tauri/binaries/sidecar-x86_64-pc-windows-msvc.exe

      - name: Install JS deps
        run: pnpm install

      - name: Build and sign Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: v__VERSION__
          releaseName: "Verba v__VERSION__"
          releaseBody: "See CHANGELOG.md for details."
          releaseDraft: false
          prerelease: false

  build-macos:
    strategy:
      matrix:
        include:
          - runner: macos-13
            target: x86_64-apple-darwin
          - runner: macos-14
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: pnpm/action-setup@v4
        with: { version: 9 }
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - name: Install PortAudio
        run: brew install portaudio
      - run: pip install uv pyinstaller
      - run: |
          export CFLAGS="-I$(brew --prefix portaudio)/include"
          export LDFLAGS="-L$(brew --prefix portaudio)/lib"
          uv pip install --system -r sidecar/requirements.txt
          pyinstaller --clean --noconfirm sidecar.spec --distpath src-tauri/binaries
          mv src-tauri/binaries/sidecar src-tauri/binaries/sidecar-${{ matrix.target }}
      - run: pnpm install
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: v__VERSION__
          releaseName: "Verba v__VERSION__"
          releaseBody: "See CHANGELOG.md for details."
          releaseDraft: false
          prerelease: false
          args: --target ${{ matrix.target }}
